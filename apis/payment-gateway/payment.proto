syntax = "proto3";

package eprod.payment.v1;

option go_package = "github.com/kru3ish/harness-yaml-templates/proto/payment/v1";

service PaymentGateway {
  // Process a new payment
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  // Refund a completed payment
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  // Get payment status
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (PaymentStatus);
  // Stream payment events (for real-time dashboard)
  rpc StreamPaymentEvents(StreamRequest) returns (stream PaymentEvent);
}

message ProcessPaymentRequest {
  string order_id = 1;
  Money amount = 2;
  PaymentMethod payment_method = 3;
  string idempotency_key = 4;
}

message ProcessPaymentResponse {
  string payment_id = 1;
  PaymentState state = 2;
  string processor_reference = 3;
}

message RefundPaymentRequest {
  string payment_id = 1;
  Money amount = 2;
  string reason = 3;
}

message RefundPaymentResponse {
  string refund_id = 1;
  PaymentState state = 2;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message PaymentStatus {
  string payment_id = 1;
  PaymentState state = 2;
  Money amount = 3;
  string created_at = 4;
  string updated_at = 5;
}

message StreamRequest {
  repeated string order_ids = 1;
}

message PaymentEvent {
  string payment_id = 1;
  string event_type = 2;
  string timestamp = 3;
  map<string, string> metadata = 4;
}

message Money {
  int64 amount_cents = 1;
  string currency = 2;
}

message PaymentMethod {
  oneof method {
    CardPayment card = 1;
    WalletPayment wallet = 2;
    BankTransfer bank = 3;
  }
}

message CardPayment {
  string token = 1;
  string last_four = 2;
  string brand = 3;
}

message WalletPayment {
  string provider = 1;
  string token = 2;
}

message BankTransfer {
  string routing_number = 1;
  string account_number = 2;
}

enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  PENDING = 1;
  PROCESSING = 2;
  COMPLETED = 3;
  FAILED = 4;
  REFUNDED = 5;
  PARTIALLY_REFUNDED = 6;
}
